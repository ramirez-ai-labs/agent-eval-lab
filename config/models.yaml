# Every model and provider this lab uses, in one place.
# Reports record these values, so every result says exactly what produced it.
#
# Workers AI facts confirmed Nov 21, 2026 from developers.cloudflare.com:
#   - Responses API (/v1/responses) works only for gpt-oss-120b and gpt-oss-20b,
#     and only with stream: false.
#   - Chat Completions (/v1/chat/completions) works for most text models.
#   - Free tier: 10,000 Neurons per day per account, reset at 00:00 UTC.

# Which provider the agent runs on: workers-ai | openai | mock
provider: workers-ai

agent:
  # OpenAI's open-weight model. Function calling: yes. Context: 128k.
  # Uses the Responses API, the same code path as the openai provider.
  # Runs must be non-streaming (Runner.run, not Runner.run_streamed).
  workers_ai_model: "@cf/openai/gpt-oss-120b"
  workers_ai_fallback: "@cf/openai/gpt-oss-20b"   # about half the cost per case
  openai_model: TODO            # a small, pinned snapshot; pick at the M2 reference run
  temperature: 0
  base_url: "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/ai/v1"

judge:
  provider: workers-ai
  # A different model family from the agent, to reduce self-preference bias.
  # Free-tier eligible (not on Cloudflare's paid-only list).
  model: "@cf/google/gemma-4-26b-a4b-it"
  temperature: 0

embeddings:
  provider: workers-ai
  model: "@cf/baai/bge-base-en-v1.5"   # computed once; vectors are committed

tracing: local                  # traces are written to runs/; no hosted exporter

budgets:                        # per case; used by the cost and latency check
  max_tokens: 8000              # provisional; tighten after the first baseline run
  max_latency_ms: 30000         # provisional

tested_on: TODO                 # date of the last live run on each provider

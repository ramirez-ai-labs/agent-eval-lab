[project]
name = "agent-eval-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "numpy>=2.5.5",
    "openai-agents>=0.25.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

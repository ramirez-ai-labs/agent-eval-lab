# Runs the offline test suite and the mock-track eval gate on every pull
# request and on pushes to main.
#
# No secrets and no model calls: the tests use the committed passage index
# and a scripted model, so CI never spends Workers AI Neurons or OpenAI credit.
# Forks can run it too, since nothing here needs credentials.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml,
      # so learners get the same versions CI tested.
      - run: uv sync --locked

      - run: uv run pytest -q

      # The eval gate on the mock track: replay the committed reference run and
      # grade it with cached judge verdicts only. Any guardrail failure exits 1.
      - name: Grade the reference run (mock track)
        run: |
          uv run python -m tracks.mock.track --out runs/mock/ci/traces.jsonl
          uv run python -m evals.run_checks runs/mock/ci/traces.jsonl --judge-cached

      # The gate has to catch a regression: with the planted failures in, the
      # same grading must fail the build.
      - name: Check the gate catches planted failures
        run: |
          uv run python -m tracks.mock.track --plant all --out runs/mock/ci-planted/traces.jsonl
          if uv run python -m evals.run_checks runs/mock/ci-planted/traces.jsonl --judge-cached; then
            echo "The planted failures were not caught: the eval gate is broken."
            exit 1
          fi
